name: Build Switchboard.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Switchboard 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download: https://github.com/${{ github.repository }}/releases/latest/download/Switchboard.exe
          files: dist/Switchboard.exe
