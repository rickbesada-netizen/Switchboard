name: Build Switchboard.exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install Windows C compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 libc6-dev >/dev/null
      - name: Resolve dependencies
        working-directory: engine
        env:
          GOTOOLCHAIN: auto
        run: |
          if [ -f go.sum ]; then go mod download; cat go.mod; exit 0; fi
          # no pinned versions yet: take the latest bridges
          go get go.mau.fi/mautrix-whatsapp@main go.mau.fi/mautrix-meta@main
          # carry over the bridges' own replace directives (e.g. Beeper's patched req library)
          for m in go.mau.fi/mautrix-meta go.mau.fi/mautrix-whatsapp; do
            f=$(go list -m -f '{{.GoMod}}' $m)
            grep -E '^replace ' "$f" >> go.mod || true
          done
          go mod tidy
          cat go.mod
      - name: Vet
        working-directory: engine
        env:
          GOTOOLCHAIN: auto
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: go vet .
      - name: Build engine.exe (Windows)
        working-directory: engine
        env:
          GOTOOLCHAIN: auto
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: go build -trimpath -ldflags "-s -w" -o bin/engine.exe .
      - name: Build engine (Linux, smoke test)
        working-directory: engine
        env:
          GOTOOLCHAIN: auto
          CGO_ENABLED: "1"
        run: |
          go build -o /tmp/engine-linux .
          mkdir -p /tmp/sbtest
          for net in whatsapp messenger instagram; do
            echo "== $net"
            ( printf '{"id":1,"cmd":"login_flows"}\n{"id":2,"cmd":"whoami"}\n'; if [ $net = whatsapp ]; then printf '{"id":4,"cmd":"login_start","args":{"flow_id":"qr"}}\n'; fi; sleep 10; printf '{"id":3,"cmd":"quit"}\n' ) | timeout 40 /tmp/engine-linux -network $net -account t$net -data /tmp/sbtest/$net 2>/tmp/sbtest/$net.log | head -c 3000
            echo
            tail -5 /tmp/sbtest/$net.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            engine/bin/engine.exe
            engine/go.mod
            engine/go.sum
      - name: Publish Linux test build to the ci-bin branch
        if: github.ref == 'refs/heads/engine'
        run: |
          rm -rf /tmp/cibin && mkdir /tmp/cibin && cd /tmp/cibin
          gzip -c /tmp/engine-linux > engine-linux.gz
          cp $GITHUB_WORKSPACE/engine/go.mod $GITHUB_WORKSPACE/engine/go.sum .
          git init -q -b ci-bin && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "test build"
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ci-bin

  app:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: engine
      - name: Check engine is in place
        shell: bash
        run: ls -la engine/bin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Switchboard 2.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download: https://github.com/${{ github.repository }}/releases/latest/download/Switchboard.exe
          files: dist/Switchboard.exe
